name: LSM enforcement install phase
vars:
  source_url: 'http://127.0.0.1:8080'
  trust_root: '/repo/public/trust_root.pub'
  data: '/var/lib/polypkg'
  bin: '/usr/local/bin'
  px: '/usr/local/bin/polypkg'
testcases:
  - name: init system scope under enforcement
    steps:
      - type: exec
        script: '{{.px}} init --source-url {{.source_url}} --trust-root {{.trust_root}} --scope system'
        assertions:
          - result.code ShouldEqual 0
  - name: install hello and tool-a system scope
    steps:
      - type: exec
        script: '{{.px}} install hello tool-a --scope system'
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "applied generation"
      - type: exec
        script: '{{.bin}}/widget'
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring widget
      - type: exec
        script: '{{.data}}/active/hello/bin/hello'
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "1.0.0"
  # ls -Z is the security-context lister: on SELinux it prints the file's label,
  # on AppArmor a '?'. Either way it must succeed and list the installed active
  # path under enforcement; if the install left the path absent, ls exits non-zero
  # and this fails (so the assertion is not vacuous).
  - name: active root path lists under enforcement
    steps:
      - type: exec
        script: 'ls -Zd {{.data}}/active/hello/bin/hello'
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "/active/hello/bin/hello"

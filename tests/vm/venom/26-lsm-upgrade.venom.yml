name: LSM enforcement upgrade phase
vars:
  data: '/var/lib/polypkg'
  bin: '/usr/local/bin'
  px: '/usr/local/bin/polypkg'
testcases:
  - name: upgrade bumps hello to the newest version under enforcement
    steps:
      - type: exec
        script: '{{.px}} upgrade --scope system'
        assertions:
          - result.code ShouldEqual 0
      - type: exec
        script: '{{.data}}/active/hello/bin/hello'
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "1.1.0"
  - name: remove unbridges the command
    steps:
      - type: exec
        script: '{{.px}} remove hello tool-a --scope system'
        assertions:
          - result.code ShouldEqual 0
      - type: exec
        script: '[ -e {{.bin}}/widget ] && echo PRESENT || echo GONE'
        assertions:
          - result.systemout ShouldContainSubstring "GONE"

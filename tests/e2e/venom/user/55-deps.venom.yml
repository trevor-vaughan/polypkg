name: Dependency resolution
vars:
  source_url: 'http://repo-server:8080'
  trust_root: '/repo/public/trust_root.pub'
  home: '/tmp/u55'
  px: 'env HOME={{.home}} XDG_DATA_HOME={{.home}}/data XDG_CONFIG_HOME={{.home}}/cfg XDG_STATE_HOME={{.home}}/state XDG_CACHE_HOME={{.home}}/cache /usr/local/bin/polypkg'

testcases:
  - name: init the sandbox
    steps:
      - type: exec
        script: '{{.px}} init --source-url {{.source_url}} --trust-root-file {{.trust_root}} --scope user'
        assertions:
          - result.code ShouldEqual 0

  - name: installing needs-hello pulls in its declared dependency
    steps:
      - type: exec
        script: '{{.px}} install needs-hello'
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "applied generation"
      - type: exec
        script: '{{.px}} --format json list'
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "needs-hello"
          - result.systemout ShouldContainSubstring "hello"

  - name: both the dependent and its dependency are placed
    steps:
      - type: exec
        script: '{{.home}}/data/polypkg/active/needs-hello/bin/needer'
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "needer 1.0.0"
      - type: exec
        script: '{{.home}}/data/polypkg/active/hello/bin/hello'
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "hello"

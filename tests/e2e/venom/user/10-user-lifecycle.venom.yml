name: User-scope lifecycle
vars:
  source_url: 'http://repo-server:8080'
  trust_root: '/repo/public/trust_root.pub'
  manifest: '/repo/polypkg-repo.yaml'
  keys: '/keys'
  fixtures: '/e2e/fixtures'
  home: '/tmp/u10'
  px: 'env HOME={{.home}} XDG_DATA_HOME={{.home}}/data XDG_CONFIG_HOME={{.home}}/cfg XDG_STATE_HOME={{.home}}/state XDG_CACHE_HOME={{.home}}/cache /usr/local/bin/polypkg'

testcases:
  - name: init writes a user profile from the served repo
    steps:
      - type: exec
        script: '{{.px}} init --source-url {{.source_url}} --trust-root-file {{.trust_root}} --scope user'
        assertions:
          - result.code ShouldEqual 0
      - type: exec
        script: 'cat {{.home}}/cfg/polypkg/profile.yaml'
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "native"

  - name: source list shows the configured source
    steps:
      - type: exec
        script: '{{.px}} source list'
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "native"
          - result.systemout ShouldContainSubstring "polypkg-native"

  - name: search finds hello in the catalog
    steps:
      - type: exec
        script: '{{.px}} --format json search hello'
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "hello"

  - name: info shows hello version
    steps:
      - type: exec
        script: '{{.px}} --format json info hello'
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "1.0.0"

  - name: install hello applies a generation and the command runs
    steps:
      - type: exec
        script: '{{.px}} install hello'
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "applied generation"
      - type: exec
        script: '{{.px}} --format json list'
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "hello"
      - type: exec
        script: '{{.home}}/data/polypkg/active/hello/bin/hello'
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "hello 1.0.0"

  - name: status reports a current generation
    steps:
      - type: exec
        script: '{{.px}} --format json status'
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldNotContainSubstring "\"error\""

  - name: upgrade moves hello to 1.1.0
    steps:
      - type: exec
        script: 'POLYPKG_REPO_KEY_PASSWORD=test-pw /usr/local/bin/polypkg repo add {{.fixtures}}/hello-1.1.0 --manifest {{.manifest}} --key-dir {{.keys}}'
        assertions:
          - result.code ShouldEqual 0
      - type: exec
        script: '{{.px}} upgrade hello'
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "applied generation"
      - type: exec
        script: '{{.home}}/data/polypkg/active/hello/bin/hello'
        assertions:
          - result.systemout ShouldContainSubstring "hello 1.1.0"

  - name: remove uninstalls hello
    steps:
      - type: exec
        script: '{{.px}} remove hello'
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "applied generation"
      - type: exec
        script: '{{.px}} --format json list'
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldNotContainSubstring "\"hello\""

  - name: rollback restores the previous generation
    steps:
      - type: exec
        script: '{{.px}} rollback'
        assertions:
          - result.code ShouldEqual 0
      - type: exec
        script: '{{.px}} --format json list'
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "hello"

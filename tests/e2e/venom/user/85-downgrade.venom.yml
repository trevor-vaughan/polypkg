name: Anti-downgrade withdrawal guard
vars:
  source_url: 'http://repo-server:8080'
  trust_root: '/repo/public/trust_root.pub'
  manifest: '/repo/polypkg-repo.yaml'
  keys: '/keys'
  fixtures: '/e2e/fixtures'
  home: '/tmp/u85'
  px: 'env HOME={{.home}} XDG_DATA_HOME={{.home}}/data XDG_CONFIG_HOME={{.home}}/cfg XDG_STATE_HOME={{.home}}/state XDG_CACHE_HOME={{.home}}/cache /usr/local/bin/polypkg'

testcases:
  - name: publish hello 1.1.0 and install it under a range constraint
    steps:
      - type: exec
        # Idempotent when suite 10 already rolled hello to 1.1.0; makes this
        # suite self-sufficient either way.
        script: 'POLYPKG_REPO_KEY_PASSWORD=test-pw /usr/local/bin/polypkg repo add {{.fixtures}}/hello-1.1.0 --manifest {{.manifest}} --key-dir {{.keys}}'
        assertions:
          - result.code ShouldEqual 0
      - type: exec
        script: '{{.px}} init --source-url {{.source_url}} --trust-root-file {{.trust_root}} --scope user'
        assertions:
          - result.code ShouldEqual 0
      - type: exec
        # A range constraint (not an exact pin) so the withdrawal below can
        # only be accepted through the explicit pin escape hatch.
        script: '{{.px}} install "hello@>=1.0.0"'
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "applied generation"
      - type: exec
        script: '{{.home}}/data/polypkg/active/hello/bin/hello'
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "hello 1.1.0"

  - name: withdrawing the installed top version forces a plan refusal
    steps:
      - type: exec
        # The rolling repo serves one version per name: re-adding the 1.0.0
        # source WITHDRAWS 1.1.0 from the signed index (serial still moves
        # forward, so this is not a stale-mirror rollback).
        script: 'POLYPKG_REPO_KEY_PASSWORD=test-pw /usr/local/bin/polypkg repo add {{.fixtures}}/hello --manifest {{.manifest}} --key-dir {{.keys}}'
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "Added hello@1.0.0"
      - type: exec
        script: '{{.px}} plan'
        assertions:
          - result.code ShouldNotEqual 0
          - result.systemerr ShouldContainSubstring "refusing to downgrade hello to 1.0.0"
          - result.systemerr ShouldContainSubstring "previously offered 1.1.0"

  - name: an explicit exact pin accepts the withdrawal downgrade
    steps:
      - type: exec
        script: '{{.px}} install hello@1.0.0'
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "applied generation"
      - type: exec
        script: '{{.home}}/data/polypkg/active/hello/bin/hello'
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "hello 1.0.0"

  - name: restore the newest hello so later suites see the rolled-forward repo
    steps:
      - type: exec
        script: 'POLYPKG_REPO_KEY_PASSWORD=test-pw /usr/local/bin/polypkg repo add {{.fixtures}}/hello-1.1.0 --manifest {{.manifest}} --key-dir {{.keys}}'
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "Added hello@1.1.0"

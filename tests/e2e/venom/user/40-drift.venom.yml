name: Drift detection and healing
vars:
  source_url: 'http://repo-server:8080'
  trust_root: '/repo/public/trust_root.pub'
  home: '/tmp/u40'
  px: 'env HOME={{.home}} XDG_DATA_HOME={{.home}}/data XDG_CONFIG_HOME={{.home}}/cfg XDG_STATE_HOME={{.home}}/state XDG_CACHE_HOME={{.home}}/cache /usr/local/bin/polypkg'

testcases:
  - name: install hello then tamper with a placed file
    steps:
      - type: exec
        script: '{{.px}} init --source-url {{.source_url}} --trust-root-file {{.trust_root}} --scope user'
        assertions:
          - result.code ShouldEqual 0
      - type: exec
        script: '{{.px}} install hello'
        assertions:
          - result.code ShouldEqual 0
      - type: exec
        script: |
          # Overwrite the placed link target out-of-band to create drift.
          target="{{.home}}/data/polypkg/active/hello/bin/hello"
          rm -f "$target"
          echo "tampered" > "$target"
        assertions:
          - result.code ShouldEqual 0

  - name: status detects the drift
    steps:
      - type: exec
        script: '{{.px}} status -v'
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "drift"

  - name: apply --heal-drift reconciles the placement
    steps:
      - type: exec
        script: '{{.px}} apply --heal-drift'
        assertions:
          - result.code ShouldEqual 0
      - type: exec
        script: '{{.home}}/data/polypkg/active/hello/bin/hello'
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring hello

  - name: accept-drift records a drifted managed path as the new baseline
    steps:
      # accept-drift is the other reconciliation path. It targets an operator-
      # mutable config file by its managed (active-root-relative) path; goodbye
      # owns one via the config action. The acceptance is recorded for the next
      # apply, so assert the action's own confirmation rather than an immediate
      # status flip (status still reports the drift until apply consumes it).
      - type: exec
        script: '{{.px}} install goodbye'
        assertions:
          - result.code ShouldEqual 0
      - type: exec
        script: 'echo "operator edit" >> {{.home}}/data/polypkg/active/goodbye/etc/goodbye.conf'
        assertions:
          - result.code ShouldEqual 0
      - type: exec
        script: '{{.px}} status -vv'
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "goodbye/etc/goodbye.conf"
      - type: exec
        script: '{{.px}} accept-drift goodbye/etc/goodbye.conf'
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "accepted drift"

  - name: an edit to the extract cache behind a symlink install is reported and healed
    steps:
      # The hello fixture installs with policy: symlink, so its placed file is a
      # link into the user-writable extract cache. Editing the cache must show
      # up as content drift (the link's own stat does not change), and apply
      # must restore the cache from the signed artifact.
      - type: exec
        script: |
          f=$(readlink -f {{.home}}/data/polypkg/active/hello/bin/hello)
          case "$f" in
            {{.home}}/state/polypkg/pkg-extract/*) ;;
            *) echo "NOT_IN_EXTRACT_STORE $f"; exit 1 ;;
          esac
          echo 'echo CACHE_TAMPERED' >> "$f"
          echo CACHE_EDITED
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "CACHE_EDITED"
      - type: exec
        script: '{{.px}} status -vv'
        assertions:
          - result.code ShouldEqual 0
          - 'result.systemout ShouldContainSubstring "hello/bin/hello (install): content"'
      - type: exec
        script: '{{.px}} apply'
        assertions:
          - result.code ShouldEqual 0
      - type: exec
        script: '{{.home}}/data/polypkg/active/hello/bin/hello'
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring hello
          - result.systemout ShouldNotContainSubstring CACHE_TAMPERED

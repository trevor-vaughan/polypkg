name: fuzz

# Mutation fuzzing runs on a schedule (and on demand), not per-push: the seed
# corpora already run as ordinary tests in the `test` workflow on every push.
# `task fuzz:all` discovers every Fuzz* target in the module and fuzzes each in
# turn, so a new fuzz test joins the nightly run without editing this file.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: task fuzz:all FUZZTIME=180s
      # go test writes each failing input under the target package's
      # testdata/fuzz/<FuzzName>/; keep them so the failure can be reproduced
      # with go test -run=<FuzzName>/<file>.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        # cancelled() also covers the job hitting timeout-minutes, which
        # GitHub reports as cancelled rather than failed.
        if: failure() || cancelled()
        with:
          name: fuzz-failing-inputs
          path: "**/testdata/fuzz/"
          if-no-files-found: ignore
          retention-days: 14

name: MegaLinter

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  megalint:
    name: MegaLinter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run shared MegaLinter policy
        id: megalint
        uses: trevor-vaughan/megalint-config@982afa2e8e189eaf601fb991d8dffa652fbfba71 # v0.3.0
        with:
          validate-all-codebase: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload MegaLinter SARIF
        if: always() && steps.megalint.outputs.sarif-has-results == 'true'
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: ${{ steps.megalint.outputs.sarif-file }}

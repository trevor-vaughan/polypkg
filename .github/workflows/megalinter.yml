name: MegaLinter

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  megalint:
    name: MegaLinter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run shared MegaLinter policy
        id: megalint
        uses: trevor-vaughan/megalint-config@latest  # zizmor: ignore[unpinned-uses]
        with:
          validate-all-codebase: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload MegaLinter SARIF
        if: always() && steps.megalint.outputs.sarif-file != ''
        uses: github/codeql-action/upload-sarif@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a # v4.36.3
        with:
          sarif_file: ${{ steps.megalint.outputs.sarif-file }}

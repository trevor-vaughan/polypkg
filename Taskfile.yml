version: '3'

includes:
  demo:
    taskfile: .taskfiles/demo.yml
  integration:
    taskfile: .taskfiles/integration.yml
  vm:
    taskfile: .taskfiles/vm.yml

vars:
  BINARY: '{{.BINARY | default "polypkg"}}'
  BUILD_DIR: '{{.BUILD_DIR | default "bin"}}'
  GO: '{{.GO | default "go"}}'
  # Prefix for every go-invoking command: it appends -mod=readonly to the
  # caller's GOFLAGS (the last -mod wins), so no task rewrites go.mod or go.sum
  # even when the shell exports GOFLAGS=-mod=mod. Commands those tasks spawn
  # (golangci-lint's and govulncheck's go list, builds inside tests) inherit
  # it. A Taskfile env: entry cannot do this: the caller's environment
  # overrides it.
  GO_READONLY: 'GOFLAGS="${GOFLAGS:+$GOFLAGS }-mod=readonly"'
  TEST_DIR: '{{.TEST_DIR | default ".test-output"}}'
  GOVULNCHECK_VERSION: '{{.GOVULNCHECK_VERSION | default "v1.3.0"}}'
  FUZZTIME: '{{.FUZZTIME | default "60s"}}'
  FUZZTARGET: '{{.FUZZTARGET | default "FuzzExtractTarZst"}}'
  FUZZPKG: '{{.FUZZPKG | default "./internal/source/"}}'

tasks:
  default:
    silent: true
    cmd: |
      task --list 2>/dev/null

  build:
    desc: Build the polypkg binary into {{.BUILD_DIR}}/
    cmd: '{{.GO_READONLY}} {{.GO}} build -o {{.BUILD_DIR}}/{{.BINARY}} ./cmd/polypkg'

  test:
    desc: Run the test suite with race detector and coverage profile
    cmds:
      - mkdir -p {{.TEST_DIR}}
      - '{{.GO_READONLY}} {{.GO}} test -race -coverprofile={{.TEST_DIR}}/coverage.out ./...'

  test:fips:
    desc: Run the test suite under Go's FIPS 140-3 module (GODEBUG=fips140=on)
    env:
      GODEBUG: fips140=on
    cmds:
      - mkdir -p {{.TEST_DIR}}
      - '{{.GO_READONLY}} {{.GO}} test -race -coverprofile={{.TEST_DIR}}/coverage-fips.out ./...'

  lint:
    desc: Run golangci-lint across all packages
    cmd: '{{.GO_READONLY}} golangci-lint run ./...'

  vuln:
    desc: Scan for known vulnerabilities with govulncheck
    cmd: '{{.GO_READONLY}} {{.GO}} run golang.org/x/vuln/cmd/govulncheck@{{.GOVULNCHECK_VERSION}} ./...'

  # fuzz runs the mutating fuzzer. Seed corpora also run as ordinary tests under
  # `task test`; this target is for deeper exploration (local or scheduled CI).
  # Override FUZZTARGET, FUZZTIME, or FUZZPKG to focus on a different target.
  fuzz:
    desc: Run the mutating fuzzer (vars FUZZTARGET, FUZZTIME, FUZZPKG)
    cmd: "{{.GO_READONLY}} {{.GO}} test -run='^$' -fuzz={{.FUZZTARGET}} -fuzztime={{.FUZZTIME}} {{.FUZZPKG}}"

  fmt:
    desc: Format all Go source with go fmt
    cmd: '{{.GO_READONLY}} {{.GO}} fmt ./...'

  generate:
    desc: Regenerate committed generated Go source (go generate)
    cmd: '{{.GO_READONLY}} {{.GO}} generate ./...'

  check:
    desc: Run all quality gates
    deps: [lint, test]

  test:integration:
    desc: 'Alias for integration:matrix (container-based E2E across the distro matrix)'
    cmds:
      - task: integration:matrix

  # Opt-in VM-based LSM-enforcement tier (boots guests under QEMU/TCG). Not part
  # of `check` or any default chain. Override DISTRO (centos|ubuntu|all).
  test:vm:
    desc: 'Alias for vm:deps + vm:run — opt-in VM LSM tier (var DISTRO, default all)'
    cmds:
      - task: vm:deps
      - task: vm:run
        vars: {DISTRO: '{{.DISTRO | default "all"}}'}

  # test:live reaches the real network (api.github.com, GitHub's release and
  # attestation storage, and the Sigstore TUF CDN), so it is opt-in and in no
  # default chain. GITHUB_TOKEN or GH_TOKEN, when set, raises GitHub's rate
  # limit; the import makes two API requests plus one per page of
  # attestations for each matched asset.
  test:live:
    desc: 'Opt-in network test: pkg import the latest cli/cli release and check its attestation'
    env:
      POLYPKG_TEST_LIVE: '1'
    cmd: "{{.GO_READONLY}} {{.GO}} test -count=1 -timeout 15m -run '^TestLiveGitHubImport$' -v ./tests/live/"

  clean:
    desc: Remove build artifacts and test output
    cmd: rm -rf {{.BUILD_DIR}} {{.TEST_DIR}}

  install:
    desc: Build and install the binary into ~/.local/bin (created if missing)
    deps: [build]
    cmds:
      - mkdir -p "$HOME/.local/bin"
      - install -m 0755 {{.BUILD_DIR}}/{{.BINARY}} "$HOME/.local/bin/{{.BINARY}}"
